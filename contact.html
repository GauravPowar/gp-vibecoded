<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Gaurav Powar</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/favicon.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Background Mesh Gradient -->
    <div class="bg-mesh">
        <div class="blob"></div>
    </div>

    <div id="navbar-placeholder"></div>

    <section style="padding: 120px 0 60px;">
        <div class="container">
            <div class="glass-window">
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="window-controls">
                        <div class="control-dot dot-close" onclick="window.location.href='index.html'"></div>
                        <div class="control-dot dot-min"></div>
                        <div class="control-dot dot-max"></div>
                    </div>
                    <div class="toolbar-center">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>
                        contact.md
                    </div>
                    <div class="toolbar-right">
                        <span style="font-family: var(--font-mono); font-size: 0.75rem; opacity: 0.6;">Markdown</span>
                    </div>
                </div>

                <!-- Window Content -->
                <div class="window-content">
                    <h1 class="page-title">Contact Me</h1>
                    
                    <div class="contact-content">
                        <div class="contact-info glass-card">
                            <h2>Get in Touch</h2>
                            <div class="contact-details">
                                <div class="contact-item">
                                    <i class="fas fa-map-marker-alt"></i>
                                    <div>
                                        <h3>Location</h3>
                                        <p>IISER Berhampur, Laudigam, Konishi Tehsil, Berhampur, District Ganjam, Odisha, PIN-760003, India</p>
                                    </div>
                                </div>
                                <div class="contact-item">
                                    <i class="fas fa-envelope"></i>
                                    <div>
                                        <h3>Email</h3>
                                        <p>contact@gauravpowar.space</p>
                                    </div>
                                </div>
                                <div class="contact-item">
                                    <i class="fas fa-university"></i>
                                    <div>
                                        <h3>Institution</h3>
                                        <p>IISER Berhampur</p>
                                    </div>
                                </div>
                            </div>
                            <div class="social-links">
                                <a href="mailto:contact@gauravpowar.space" class="email-link" title="Email Me"><i class="fas fa-envelope"></i></a>
                                <a href="https://www.linkedin.com/in/gauravpowarin/" target="_blank" rel="noopener noreferrer" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                                <a href="https://www.researchgate.net/profile/Gaurav-Powar/" target="_blank" rel="noopener noreferrer" title="ResearchGate"><i class="fa-brands fa-researchgate"></i></a>
                            </div>
                        </div>

                        <div class="contact-form glass-card">
                            <h2>Send a Message</h2>
                            <div class="google-form-container">
                                <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScwuGYb8c_5iQ0y1SG61SpRVTEw2Hp7utYQOSHD0mhFDaBPlQ/viewform?embedded=true" 
                                    width="100%" height="600" frameborder="0" marginheight="0" marginwidth="0" style="background: transparent;">Loading…</iframe>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-placeholder"></div>
    <script src="js/script.js"></script>
</body>
</html>
